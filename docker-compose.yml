version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: TaskManager.API/Dockerfile
    ports:
      - "5266:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=taskmanager;Username=postgres;Password=postgres123
      - RabbitMQ__Host=rabbitmq
    depends_on:
      - postgres
      - rabbitmq

  frontend:
    build:
      context: ./taskmanager-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres_data: